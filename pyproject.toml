[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifegraph"
version = "0.1.0"
description = "A private, encrypted graph of your life that your chats can write to"
requires-python = ">=3.11"
dependencies = ["sqlcipher3-binary", "pynacl", "mcp", "keyring", "numpy"]

[project.optional-dependencies]
semantic = ["fastembed"]
dev = ["pytest"]

[project.scripts]
life = "lifegraph.cli:main"
lifegraphd = "lifegraph.daemon:serve"
lifegraph-mcp = "lifegraph.mcp_server:main"
lifegraph-queue = "lifegraph.queue_cli:main"

[tool.setuptools]
packages = ["lifegraph"]
