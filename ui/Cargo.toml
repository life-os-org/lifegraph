[package]
name = "lifegraph-ui"
version = "0.1.0"
edition = "2021"
description = "Native GPU front-end for lifegraph"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
bytemuck = { version = "1", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
